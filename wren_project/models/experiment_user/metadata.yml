name: experiment_user
properties:
  description: >
    ONE ROW PER ASSIGNED USER for the test window, with their metrics pre-aggregated
    and zero-filled. This is the correct grain for every experiment metric and the
    root of the metric cube, for one reason: because a user appears here even when
    they never became active, COUNT(*) on this table IS the assigned population.
    Computing the same aggregates on experiment_daily instead silently drops
    inactive users from every denominator and overstates lift.
    Pre-period columns (pre_sessions, pre_revenue) are the CUPED covariates.
table_reference:
  catalog: analytics
  schema: ab
  table: fact_assigned_with_pre
columns:
  - name: user_id
    type: varchar
  - name: experiment_id
    type: varchar
  - name: variant
    type: varchar
    description: The arm the user was assigned to. 'control' is the baseline.
  - name: country
    type: varchar
  - name: platform
    type: varchar
  - name: days_active
    type: bigint
  - name: sessions
    type: bigint
  - name: pageviews
    type: bigint
  - name: add_to_cart
    type: bigint
  - name: purchases
    type: bigint
  - name: revenue_usd
    type: double
  - name: pre_sessions
    type: bigint
    description: Pre-period sessions. CUPED covariate.
  - name: pre_pageviews
    type: bigint
    description: Pre-period pageviews. CUPED covariate.
  - name: pre_revenue
    type: double
    description: Pre-period revenue. CUPED covariate.
  - name: pre_days
    type: bigint
    description: Pre-period active days. CUPED covariate.
  - name: pre_add_to_cart
    type: bigint
    description: Pre-period cart adds.
  - name: pre_purchases
    type: bigint
    description: >
      Pre-period purchase events. Combined with pre_revenue this defines the
      pre-period AOV, so the CUPED covariate exists for revenue_per_purchaser too.
  - name: pre_session_duration_s
    type: double
    description: Pre-period session duration in seconds. CUPED covariate.
