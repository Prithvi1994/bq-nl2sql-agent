name: experiment_daily
properties:
  description: >
    One row per experiment per day per variant — the platform's daily-aggregated
    grain. Every experiment table conforms to this column set. users is the
    number of ASSIGNED users active that day per arm: it is the only correct
    denominator column; dividing by COUNT of day-rows is user-days, not users.
table_reference:
  catalog: abtest
  schema: main
  table: fact_daily_variant_metrics
columns:
  - name: metric_date
    type: date
  - name: experiment_id
    type: varchar
  - name: variant
    type: varchar
    description: The arm the day's activity belongs to. 'control' is the baseline.
  - name: phase
    type: varchar
    description: "'pre' is before the test started, 'test' is the test window."
  - name: users
    type: bigint
    description: Assigned users active this day per arm. The denominator column.
  - name: sessions
    type: bigint
  - name: pageviews
    type: bigint
  - name: purchases
    type: bigint
  - name: revenue_usd
    type: double
  - name: country
    type: varchar
