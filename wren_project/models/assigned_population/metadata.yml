name: assigned_population
properties:
  description: >
    One row per user per experiment at the moment of randomisation. This is the
    authoritative denominator for every experiment metric: a user appears here
    whether or not they ever became active. Counting distinct users in
    experiment_daily instead of using this view drops inactive users and inflates
    every rate.
ref_sql: |
  SELECT a.user_id, a.experiment_id, a.variant, a.country, a.platform,
         COALESCE(p.pre_sessions, 0) AS pre_sessions,
         COALESCE(p.pre_pageviews, 0) AS pre_pageviews,
         COALESCE(p.pre_revenue, 0.0) AS pre_revenue,
         COALESCE(p.pre_days, 0) AS pre_days,
         COALESCE(p.pre_add_to_cart, 0) AS pre_add_to_cart,
         COALESCE(p.pre_purchases, 0) AS pre_purchases,
         COALESCE(p.pre_session_duration_s, 0.0) AS pre_session_duration_s
  FROM fact_user_assignments a
  LEFT JOIN fact_pre_period_totals p USING (user_id, experiment_id)
columns:
  - name: user_id
    type: varchar
  - name: experiment_id
    type: varchar
  - name: variant
    type: varchar
  - name: country
    type: varchar
  - name: platform
    type: varchar
  - name: pre_sessions
    type: bigint
    description: Pre-period sessions. CUPED covariate, carried so the windowed lift query can group by it.
  - name: pre_pageviews
    type: bigint
    description: Pre-period pageviews. CUPED covariate.
  - name: pre_revenue
    type: double
    description: Pre-period revenue. CUPED covariate.
  - name: pre_days
    type: bigint
    description: Pre-period active days. CUPED covariate.
  - name: pre_add_to_cart
    type: bigint
    description: Pre-period cart adds.
  - name: pre_purchases
    type: bigint
    description: Pre-period purchase events.
  - name: pre_session_duration_s
    type: double
    description: Pre-period session duration in seconds.