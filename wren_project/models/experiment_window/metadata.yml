name: experiment_window
properties:
  description: >
    One row per assigned user per test day, with metrics zero-filled. This is the
    windowed grain: use it whenever a question names a date range, because
    experiment_user is pre-aggregated over the whole test phase and cannot honour a
    window. A user with no activity has no rows here, so any query over this model
    must GROUP BY user_id (and variant) to keep them in the denominator — the
    aggregation is what restores the population, not the table.
table_reference:
  catalog: analytics
  schema: ab
  table: fact_assigned_daily
columns:
  - name: user_id
    type: varchar
  - name: experiment_id
    type: varchar
  - name: variant
    type: varchar
    description: The arm the user was assigned to. 'control' is the baseline.
  - name: country
    type: varchar
  - name: platform
    type: varchar
  - name: metric_date
    type: date
  - name: days_active
    type: bigint
  - name: sessions
    type: bigint
  - name: pageviews
    type: bigint
  - name: add_to_cart
    type: bigint
  - name: purchases
    type: bigint
  - name: revenue_usd
    type: double
  - name: session_duration_s
    type: double
