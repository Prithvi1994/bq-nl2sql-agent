name: experiment_metrics
properties:
  description: >
    THE metric catalog for the daily-aggregated grain. These measures are the only
    sanctioned way to compute an experiment metric; never hand-write an aggregate
    over experiment_daily. Rooted at experiment_daily (one row per day per variant):
    the denominator rules live in the measures' structure itself — every rate is
    SUM(numerator) / SUM(users), never an average of day-level rates and never
    COUNT of day-rows.
base_object: experiment_daily
measures:
  # --- population ------------------------------------------------------------------
  - name: assigned_users
    expression: SUM(users)
    type: bigint
    description: >
      The denominator of record at daily grain: the sum of assigned users active
      per day. NOT COUNT(*) — COUNT(*) over day-rows is user-days and inflates
      every rate by ~40x. Pooling rule: SUM(numerator) / SUM(users); never
      AVG(day rates), which weights quiet days equally with heavy days.
  # --- conversion ------------------------------------------------------------------
  - name: total_purchases
    expression: SUM(purchases)
    type: bigint
    description: Total purchase events in the window.
  - name: purchase_rate
    expression: SAFE_DIVIDE(total_purchases, assigned_users)
    type: double
    description: >
      Pooled conversion: total purchase events over total assigned active users.
      This is the sum-ratio estimator; the day-level CI lives in stats.py, not here.
  # --- engagement ------------------------------------------------------------------
  - name: total_sessions
    expression: SUM(sessions)
    type: bigint
    description: Total sessions in the window.
  - name: sessions_per_user
    expression: SAFE_DIVIDE(total_sessions, assigned_users)
    type: double
    description: Pooled sessions per assigned active user.
  - name: total_pageviews
    expression: SUM(pageviews)
    type: bigint
    description: Total pageviews in the window.
  - name: pageviews_per_user
    expression: SAFE_DIVIDE(total_pageviews, assigned_users)
    type: double
    description: Pooled pageviews per assigned active user.
  # --- revenue ---------------------------------------------------------------------
  - name: total_revenue
    expression: SUM(revenue_usd)
    type: double
    description: Total revenue in USD.
  - name: revenue_per_user
    expression: SAFE_DIVIDE(total_revenue, assigned_users)
    type: double
    description: Pooled revenue per assigned active user, including zero-spend days.
  - name: revenue_per_purchaser
    expression: SAFE_DIVIDE(total_revenue, total_purchases)
    type: double
    description: >
      Average order value. Denominator is purchase EVENTS. Dividing by assigned_users
      here silently redefines the metric as revenue_per_user.
dimensions:
  - name: variant
    expression: variant
    type: varchar
    description: The arm the day's activity belongs to. 'control' is the baseline.
  - name: experiment_id
    expression: experiment_id
    type: varchar
  - name: metric_date
    expression: metric_date
    type: date
  - name: country
    expression: country
    type: varchar
